<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Four Common Agent Pattern Compositions</title>
  <desc id="desc">Starter compositions for knowledge answering, long-running work, transactional action, and multi-agent research, with observability, evaluation and validation, and security and identity spanning the paths.</desc>
  <rect width="1600" height="960" fill="#f7f9fc"/>
  <text x="92" y="92" fill="#0d1b2f" font-family="Arial, sans-serif" font-size="46" font-weight="700">Common Pattern Compositions</text>
  <text x="92" y="138" fill="#607087" font-family="Arial, sans-serif" font-size="23">Choose a task-completion path, then add protection, feedback, and collaboration for observed failure modes</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(92 196)">
      <rect width="1416" height="144" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/><rect width="250" height="144" rx="6" fill="#0d1b2f"/>
      <text x="28" y="55" fill="#e0b35f" font-size="18" font-weight="700">READ / ANSWER</text><text x="28" y="94" fill="#ffffff" font-size="26" font-weight="700">Knowledge Q&amp;A</text>
      <text x="284" y="54" fill="#0d1b2f" font-size="21" font-weight="700">P1 Context Triage</text><text x="487" y="54" fill="#9a6a18" font-size="24">→</text><text x="531" y="54" fill="#0d1b2f" font-size="21" font-weight="700">M2 RAG</text><text x="638" y="54" fill="#9a6a18" font-size="24">→</text><text x="682" y="54" fill="#0d1b2f" font-size="21" font-weight="700">R2 Complexity Routing</text>
      <text x="284" y="103" fill="#607087" font-size="18">Completion: key claims resolve to source evidence; mechanical state uses structured queries.</text>
    </g>
    <g transform="translate(92 360)">
      <rect width="1416" height="144" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/><rect width="250" height="144" rx="6" fill="#16395c"/>
      <text x="28" y="55" fill="#e0b35f" font-size="18" font-weight="700">LONG-RUNNING</text><text x="28" y="94" fill="#ffffff" font-size="26" font-weight="700">Extended work</text>
      <text x="284" y="54" fill="#0d1b2f" font-size="21" font-weight="700">P1 Context Triage</text><text x="487" y="54" fill="#9a6a18" font-size="24">→</text><text x="531" y="54" fill="#0d1b2f" font-size="21" font-weight="700">M3 Progress Tracking</text><text x="750" y="54" fill="#9a6a18" font-size="24">→</text><text x="794" y="54" fill="#0d1b2f" font-size="21" font-weight="700">A2 Plan and Execute</text><text x="997" y="54" fill="#9a6a18" font-size="24">→</text><text x="1041" y="54" fill="#0d1b2f" font-size="21" font-weight="700">F3 Experience Replay</text>
      <text x="284" y="103" fill="#607087" font-size="18">Completion: a checkpoint restores goal, state references, and next action without repeating effects.</text>
    </g>
    <g transform="translate(92 524)">
      <rect width="1416" height="144" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/><rect width="250" height="144" rx="6" fill="#315b52"/>
      <text x="28" y="55" fill="#f1c979" font-size="18" font-weight="700">WRITE / COMMIT</text><text x="28" y="94" fill="#ffffff" font-size="26" font-weight="700">Transactions</text>
      <text x="284" y="54" fill="#0d1b2f" font-size="21" font-weight="700">A2 Plan and Execute</text><text x="493" y="54" fill="#9a6a18" font-size="24">→</text><text x="537" y="54" fill="#0d1b2f" font-size="21" font-weight="700">A1 Tool Dispatch</text><text x="712" y="54" fill="#9a6a18" font-size="24">→</text><text x="756" y="54" fill="#0d1b2f" font-size="21" font-weight="700">G1 Approval Gate</text><text x="934" y="54" fill="#9a6a18" font-size="24">+</text><text x="978" y="54" fill="#0d1b2f" font-size="21" font-weight="700">G2 Blast-Radius Control</text>
      <text x="284" y="103" fill="#607087" font-size="18">Completion: the concrete intent is approved, impact is bounded, and the business system confirms the result.</text>
    </g>
    <g transform="translate(92 688)">
      <rect width="1416" height="144" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/><rect width="250" height="144" rx="6" fill="#5a456a"/>
      <text x="28" y="55" fill="#f1c979" font-size="18" font-weight="700">MULTI-AGENT</text><text x="28" y="94" fill="#ffffff" font-size="26" font-weight="700">Research &amp; review</text>
      <text x="284" y="54" fill="#0d1b2f" font-size="21" font-weight="700">P3 Progressive Discovery</text><text x="531" y="54" fill="#9a6a18" font-size="24">→</text><text x="575" y="54" fill="#0d1b2f" font-size="21" font-weight="700">R3 Parallel Exploration</text><text x="806" y="54" fill="#9a6a18" font-size="24">→</text><text x="850" y="54" fill="#0d1b2f" font-size="21" font-weight="700">C2 Fan-Out/Gather</text><text x="1047" y="54" fill="#9a6a18" font-size="24">→</text><text x="1091" y="54" fill="#0d1b2f" font-size="21" font-weight="700">C3 Adversarial Review</text>
      <text x="284" y="103" fill="#607087" font-size="18">Completion: branches use independent evidence, aggregation is explicit, and reviewers do not share one corrupted premise.</text>
    </g>
  </g>
  <line x1="92" y1="882" x2="1508" y2="882" stroke="#c8912f" stroke-width="3"/>
  <text x="800" y="921" text-anchor="middle" fill="#0d1b2f" font-family="Arial, sans-serif" font-size="21" font-weight="700">X1 Observability · X2 Evaluation &amp; Validation · X3 Security &amp; Identity span each path according to risk</text>
</svg>
