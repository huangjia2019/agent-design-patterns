<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">技术文档审查 Agent 的模式选型示例</title>
  <desc id="desc">从源文档到带引用审查报告的五段流程，使用上下文分诊、复杂度路由和生成评审循环，并由可观测性和评测验证支撑。</desc>
  <rect width="1200" height="430" fill="#fafaf9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <rect x="35" y="60" width="190" height="150" rx="6"/>
      <rect x="270" y="60" width="190" height="150" rx="6"/>
      <rect x="505" y="60" width="190" height="150" rx="6"/>
      <rect x="740" y="60" width="190" height="150" rx="6"/>
      <rect x="975" y="60" width="190" height="150" rx="6"/>
    </g>
    <g stroke="#0f3a5f" stroke-width="3" fill="none">
      <path d="M225 135 H260"/><path d="M460 135 H495"/><path d="M695 135 H730"/><path d="M930 135 H965"/>
    </g>
    <g fill="#0f3a5f">
      <path d="M260 135 l-10 -6 v12 z"/><path d="M495 135 l-10 -6 v12 z"/><path d="M730 135 l-10 -6 v12 z"/><path d="M965 135 l-10 -6 v12 z"/>
    </g>
    <g fill="#b8842b" font-size="15" font-weight="700">
      <text x="55" y="91">任务边界</text><text x="290" y="91">P1 · 感知</text><text x="525" y="91">R2 · 路由</text><text x="760" y="91">F1 · 循环</text><text x="995" y="91">输出</text>
    </g>
    <g fill="#0f172a" font-size="18" font-weight="700">
      <text x="55" y="123">源料与标准</text><text x="290" y="123">上下文分诊</text><text x="525" y="123">复杂度路由</text><text x="760" y="123">生成评审</text><text x="995" y="123">带引用审查</text>
    </g>
    <g fill="#475569" font-size="15">
      <text x="55" y="155">设计稿</text><text x="55" y="179">审查标准</text>
      <text x="290" y="155">范围</text><text x="290" y="179">证据契约</text>
      <text x="525" y="155">快速路径</text><text x="525" y="179">深度路径</text>
      <text x="760" y="155">起草 · 审查</text><text x="760" y="179">修订 · 停止</text>
      <text x="995" y="155">问题与依据</text><text x="995" y="179">开放问题</text>
    </g>
    <rect x="35" y="275" width="1130" height="95" rx="6" fill="#0f3a5f"/>
    <text x="65" y="311" fill="#fdf6e3" font-size="16" font-weight="700">横切工程面</text>
    <text x="65" y="343" fill="#ffffff" font-size="17"><tspan font-weight="700">X1 可观测性</tspan><tspan> · 轨迹、证据与版本</tspan></text>
    <text x="610" y="343" fill="#ffffff" font-size="17"><tspan font-weight="700">X2 评测与验证</tspan><tspan> · 验收与回归</tspan></text>
  </g>
</svg>
