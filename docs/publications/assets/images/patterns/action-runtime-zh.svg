<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">行动模块运行顺序</title>
  <desc id="desc">推理决定通过目标合同、计划步骤、结构化产物、工具准入和守卫夹层后执行，最后记录业务事实与证据。</desc>
  <rect width="1400" height="460" fill="#ffffff"/>
  <text x="54" y="50" fill="#0f2742" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="700">行动模块：把判断变成可验收的外部变化</text>
  <text x="54" y="78" fill="#64748b" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="14">每一步都有明确输入、准入判断、运行证据和失败去向</text>

  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif">
    <rect x="54" y="126" width="170" height="116" rx="6" fill="#f5f7fa" stroke="#cbd5e1"/>
    <text x="139" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">推理决定</text>
    <text x="139" y="184" text-anchor="middle" fill="#64748b" font-size="12">（Reasoning Decision）</text>
    <text x="139" y="214" text-anchor="middle" fill="#475569" font-size="13">目标合同 + 计划</text>

    <rect x="252" y="126" width="170" height="116" rx="6" fill="#edf7f6" stroke="#a9cfc9"/>
    <text x="337" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">选出当前步骤</text>
    <text x="337" y="184" text-anchor="middle" fill="#64748b" font-size="12">（Plan Step）</text>
    <text x="337" y="214" text-anchor="middle" fill="#475569" font-size="13">执行器（Executor）</text>

    <rect x="450" y="126" width="170" height="116" rx="6" fill="#edf7f6" stroke="#a9cfc9"/>
    <text x="535" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">构造步骤产物</text>
    <text x="535" y="184" text-anchor="middle" fill="#64748b" font-size="12">（Artifact）</text>
    <text x="535" y="214" text-anchor="middle" fill="#475569" font-size="13">提示链（Prompt Chain）</text>

    <rect x="648" y="126" width="170" height="116" rx="6" fill="#fff8e8" stroke="#d6b36c"/>
    <text x="733" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">工具候选与准入</text>
    <text x="733" y="184" text-anchor="middle" fill="#64748b" font-size="12">（Tool Admission）</text>
    <text x="733" y="214" text-anchor="middle" fill="#475569" font-size="13">工具调度（Dispatcher）</text>

    <rect x="846" y="112" width="302" height="144" rx="6" fill="#f8fafc" stroke="#b7c3d0"/>
    <text x="997" y="140" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">守卫夹层（Guardrail Sandwich）</text>
    <rect x="866" y="164" width="76" height="58" rx="4" fill="#fff8e8" stroke="#d6b36c"/>
    <text x="904" y="188" text-anchor="middle" fill="#0f2742" font-size="15" font-weight="700">执行前</text>
    <text x="904" y="208" text-anchor="middle" fill="#64748b" font-size="11">（PRE）</text>
    <rect x="959" y="164" width="76" height="58" rx="4" fill="#0f2742"/>
    <text x="997" y="188" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">工具</text>
    <text x="997" y="208" text-anchor="middle" fill="#dce7f0" font-size="11">（TOOL）</text>
    <rect x="1052" y="164" width="76" height="58" rx="4" fill="#fff8e8" stroke="#d6b36c"/>
    <text x="1090" y="188" text-anchor="middle" fill="#0f2742" font-size="15" font-weight="700">执行后</text>
    <text x="1090" y="208" text-anchor="middle" fill="#64748b" font-size="11">（POST）</text>

    <rect x="1176" y="126" width="170" height="116" rx="6" fill="#0f2742"/>
    <text x="1261" y="158" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">外部状态已改变</text>
    <text x="1261" y="187" text-anchor="middle" fill="#dce7f0" font-size="13">业务回执</text>
    <text x="1261" y="211" text-anchor="middle" fill="#dce7f0" font-size="13">或明确失败</text>
  </g>

  <g stroke="#b37a1a" stroke-width="3" fill="none">
    <path d="M224 184 H252"/><path d="M422 184 H450"/><path d="M620 184 H648"/><path d="M818 184 H846"/><path d="M1148 184 H1176"/>
  </g>
  <g fill="#b37a1a">
    <path d="M252 184 l-10 -6 v12 z"/><path d="M450 184 l-10 -6 v12 z"/><path d="M648 184 l-10 -6 v12 z"/><path d="M846 184 l-10 -6 v12 z"/><path d="M1176 184 l-10 -6 v12 z"/>
  </g>

  <path d="M997 256 V300 H700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  <path d="M1261 242 V300 H700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  <rect x="312" y="300" width="776" height="100" rx="6" fill="#f8fafc" stroke="#d8dee7"/>
  <text x="700" y="329" text-anchor="middle" fill="#0f2742" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="700">三类证据共同说明发生了什么</text>
  <text x="470" y="365" text-anchor="middle" fill="#475569" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="15">业务账本（Business Ledger）</text>
  <text x="700" y="365" text-anchor="middle" fill="#475569" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="15">统一行动事件（Action Event）</text>
  <text x="930" y="365" text-anchor="middle" fill="#475569" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="15">检查点（Checkpoint）</text>
  <line x1="54" y1="430" x2="1346" y2="430" stroke="#d8dee7"/>
  <text x="54" y="452" fill="#64748b" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="13">模型的“完成”声明不代替业务事实和外部验收。</text>
</svg>
