<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-label="Agent governance control plane">
  <title>Agent governance control plane</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Open Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 12px; fill: #475569; }
      .light { fill: #ffffff; }
      .light-subtle { fill: #dbe6f3; }
      .brass-ink { fill: #5f4515; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<text x="60" y="55" class="title">Agent governance control plane</text>
<rect x="60" y="160" width="280" height="110" rx="7" fill="#eef5f7" stroke="#5b8792" stroke-width="2"/>
<text x="200.0" y="204.0" text-anchor="middle" dominant-baseline="middle" class="label">Delegation chain</text>
<text x="200.0" y="226.0" text-anchor="middle" dominant-baseline="middle" class="small">user → agent → workload → run</text>
<rect x="60" y="480" width="280" height="110" rx="7" fill="#eef5f7" stroke="#5b8792" stroke-width="2"/>
<text x="200.0" y="524.0" text-anchor="middle" dominant-baseline="middle" class="label">Domain ownership</text>
<text x="200.0" y="546.0" text-anchor="middle" dominant-baseline="middle" class="small">risk · acceptance · approvers · incidents</text>
<rect x="480" y="105" width="480" height="105" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="720.0" y="146.5" text-anchor="middle" dominant-baseline="middle" class="label">Registry</text>
<text x="720.0" y="168.5" text-anchor="middle" dominant-baseline="middle" class="small">identity · owner · version · tools · retirement</text>
<path d="M 720.0 210 L 720.0 228" class="line"/>
<rect x="480" y="232" width="480" height="105" rx="7" fill="#fff7df" stroke="#b8842b" stroke-width="2"/>
<text x="720.0" y="273.5" text-anchor="middle" dominant-baseline="middle" class="label brass-ink">Policy</text>
<text x="720.0" y="295.5" text-anchor="middle" dominant-baseline="middle" class="small">authority · risk · budget · approval · exceptions</text>
<path d="M 720.0 337 L 720.0 355" class="line"/>
<rect x="480" y="359" width="480" height="105" rx="7" fill="#0f3a5f" stroke="#0f3a5f" stroke-width="2"/>
<text x="720.0" y="400.5" text-anchor="middle" dominant-baseline="middle" class="label light">Enforcement</text>
<text x="720.0" y="422.5" text-anchor="middle" dominant-baseline="middle" class="small light-subtle">tool filtering · tokens · sandbox · quota · breaker</text>
<path d="M 720.0 464 L 720.0 482" class="line"/>
<rect x="480" y="486" width="480" height="105" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="720.0" y="527.5" text-anchor="middle" dominant-baseline="middle" class="label">Observation</text>
<text x="720.0" y="549.5" text-anchor="middle" dominant-baseline="middle" class="small">events · causality · state deltas · receipts</text>
<rect x="1100" y="210" width="280" height="110" rx="7" fill="#0f3a5f" stroke="#0f3a5f" stroke-width="2"/>
<text x="1240.0" y="254.0" text-anchor="middle" dominant-baseline="middle" class="label light">Agent runtime</text>
<text x="1240.0" y="276.0" text-anchor="middle" dominant-baseline="middle" class="small light-subtle">model · tools · subagents</text>
<rect x="1100" y="470" width="280" height="110" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1240.0" y="514.0" text-anchor="middle" dominant-baseline="middle" class="label">Domain systems</text>
<text x="1240.0" y="536.0" text-anchor="middle" dominant-baseline="middle" class="small">resources · state · outcomes</text>
<path d="M 340 215 L 474 158" class="line"/>
<path d="M 340 535 L 474 285" class="line"/>
<path d="M 960 411 L 1094 265" class="line"/>
<path d="M 1240 320 L 1240 464" class="line"/>
<path d="M 1100 525 L 966 590" class="line"/>
<path d="M 720 613 C 720 690, 610 690, 610 590" class="dash"/>
<text x="735" y="686" class="small">Operating evidence informs policy and authority disposition</text>
</svg>