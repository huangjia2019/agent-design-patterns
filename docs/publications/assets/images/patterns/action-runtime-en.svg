<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Action module runtime sequence</title>
  <desc id="desc">A reasoning decision passes through goal and plan, current step selection, artifact construction, tool admission, guardrails, execution, and evidence recording.</desc>
  <rect width="1400" height="460" fill="#ffffff"/>
  <text x="54" y="50" fill="#0f2742" font-family="Arial, sans-serif" font-size="24" font-weight="700">Action: turn a decision into a verifiable external change</text>
  <text x="54" y="78" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Each step has defined input, admission, runtime evidence, and failure handling</text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="126" width="170" height="116" rx="6" fill="#f5f7fa" stroke="#cbd5e1"/>
    <text x="139" y="166" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">Reasoning decision</text>
    <text x="139" y="198" text-anchor="middle" fill="#475569" font-size="13">Goal Contract + Plan</text>

    <rect x="252" y="126" width="170" height="116" rx="6" fill="#edf7f6" stroke="#a9cfc9"/>
    <text x="337" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">Select current</text>
    <text x="337" y="184" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">PlanStep</text>
    <text x="337" y="214" text-anchor="middle" fill="#475569" font-size="13">Executor</text>

    <rect x="450" y="126" width="170" height="116" rx="6" fill="#edf7f6" stroke="#a9cfc9"/>
    <text x="535" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">Build structured</text>
    <text x="535" y="184" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">artifact</text>
    <text x="535" y="214" text-anchor="middle" fill="#475569" font-size="13">Prompt chain</text>

    <rect x="648" y="126" width="170" height="116" rx="6" fill="#fff8e8" stroke="#d6b36c"/>
    <text x="733" y="160" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">Tool candidates</text>
    <text x="733" y="184" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">and admission</text>
    <text x="733" y="214" text-anchor="middle" fill="#475569" font-size="13">Dispatcher</text>

    <rect x="846" y="112" width="302" height="144" rx="6" fill="#f8fafc" stroke="#b7c3d0"/>
    <text x="997" y="140" text-anchor="middle" fill="#0f2742" font-size="17" font-weight="700">Guardrail Sandwich</text>
    <rect x="866" y="164" width="76" height="58" rx="4" fill="#fff8e8" stroke="#d6b36c"/>
    <text x="904" y="199" text-anchor="middle" fill="#0f2742" font-size="15" font-weight="700">PRE</text>
    <rect x="959" y="164" width="76" height="58" rx="4" fill="#0f2742"/>
    <text x="997" y="199" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">TOOL</text>
    <rect x="1052" y="164" width="76" height="58" rx="4" fill="#fff8e8" stroke="#d6b36c"/>
    <text x="1090" y="199" text-anchor="middle" fill="#0f2742" font-size="15" font-weight="700">POST</text>

    <rect x="1176" y="126" width="170" height="116" rx="6" fill="#0f2742"/>
    <text x="1261" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">External state</text>
    <text x="1261" y="184" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">changed</text>
    <text x="1261" y="214" text-anchor="middle" fill="#dce7f0" font-size="13">Receipt or failure</text>
  </g>

  <g stroke="#b37a1a" stroke-width="3" fill="none"><path d="M224 184 H252"/><path d="M422 184 H450"/><path d="M620 184 H648"/><path d="M818 184 H846"/><path d="M1148 184 H1176"/></g>
  <g fill="#b37a1a"><path d="M252 184 l-10 -6 v12 z"/><path d="M450 184 l-10 -6 v12 z"/><path d="M648 184 l-10 -6 v12 z"/><path d="M846 184 l-10 -6 v12 z"/><path d="M1176 184 l-10 -6 v12 z"/></g>
  <path d="M997 256 V300 H700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  <path d="M1261 242 V300 H700" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  <rect x="312" y="300" width="776" height="100" rx="6" fill="#f8fafc" stroke="#d8dee7"/>
  <text x="700" y="329" text-anchor="middle" fill="#0f2742" font-family="Arial, sans-serif" font-size="17" font-weight="700">Three evidence sources establish what happened</text>
  <text x="470" y="365" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">Business ledger</text>
  <text x="700" y="365" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">Unified ActionEvent</text>
  <text x="930" y="365" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="15">Checkpoint</text>
  <line x1="54" y1="430" x2="1346" y2="430" stroke="#d8dee7"/>
  <text x="54" y="452" fill="#64748b" font-family="Arial, sans-serif" font-size="13">The agent's completion claim does not replace business facts or external acceptance.</text>
</svg>
