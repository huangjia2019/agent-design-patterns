<text x="60" y="486" class="small">Across all patterns and stages</text>
<rect x="60" y="510" width="440" height="108" rx="7" fill="#fff7df" stroke="#b8842b" stroke-width="2"/>
<text x="280.0" y="553.0" text-anchor="middle" dominant-baseline="middle" class="label brass-ink">X1 Observability</text>
<text x="280.0" y="575.0" text-anchor="middle" dominant-baseline="middle" class="small">events · causality · versions · outcomes</text>
