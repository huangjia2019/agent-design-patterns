<text x="1220.0" y="575.0" text-anchor="middle" dominant-baseline="middle" class="small">principals · delegation · credentials · bounds</text>
<path d="M 1220.0 510 L 750 410" class="dash"/>
<text x="750" y="690" text-anchor="middle" class="small">The dual axis locates patterns; X1–X3 provide system-wide foundations; lifecycle records entry, change, and retirement.</text>
