<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-label="Agent governance lifecycle">
  <title>Agent governance lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Open Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 12px; fill: #475569; }
      .light { fill: #ffffff; }
      .light-subtle { fill: #dbe6f3; }
      .brass-ink { fill: #5f4515; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<text x="60" y="55" class="title">Agent governance lifecycle</text>
<rect x="60" y="110" width="300" height="130" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="210.0" y="164.0" text-anchor="middle" dominant-baseline="middle" class="label">01 Register &amp; own</text>
<text x="210.0" y="186.0" text-anchor="middle" dominant-baseline="middle" class="small">identity · owner · purpose · retirement</text>
<path d="M 360 175 L 404 175" class="line"/>
<rect x="410" y="110" width="300" height="130" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="164.0" text-anchor="middle" dominant-baseline="middle" class="label">02 Design &amp; version</text>
<text x="560.0" y="186.0" text-anchor="middle" dominant-baseline="middle" class="small">model · prompt · tools · skills · policy</text>
<path d="M 710 175 L 754 175" class="line"/>
<rect x="760" y="110" width="300" height="130" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="910.0" y="164.0" text-anchor="middle" dominant-baseline="middle" class="label">03 Offline eval</text>
<text x="910.0" y="186.0" text-anchor="middle" dominant-baseline="middle" class="small">capability · safety · regression · cost</text>
<path d="M 1060 175 L 1104 175" class="line"/>
<rect x="1110" y="110" width="300" height="130" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1260.0" y="164.0" text-anchor="middle" dominant-baseline="middle" class="label">04 Shadow &amp; canary</text>
<text x="1260.0" y="186.0" text-anchor="middle" dominant-baseline="middle" class="small">real distribution · no effect · small scope</text>
<path d="M 1260 240 L 1260 354" class="line"/>
<rect x="1110" y="360" width="300" height="130" rx="7" fill="#0f3a5f" stroke="#0f3a5f" stroke-width="2"/>
<text x="1260.0" y="414.0" text-anchor="middle" dominant-baseline="middle" class="label light">05 Controlled operation</text>
<text x="1260.0" y="436.0" text-anchor="middle" dominant-baseline="middle" class="small light-subtle">identity · approval · containment · ReAct</text>
<path d="M 1110 425 L 1066 425" class="line"/>
<rect x="760" y="360" width="300" height="130" rx="7" fill="#fff7df" stroke="#b8842b" stroke-width="2"/>
<text x="910.0" y="414.0" text-anchor="middle" dominant-baseline="middle" class="label brass-ink">06 Observe &amp; attribute</text>
<text x="910.0" y="436.0" text-anchor="middle" dominant-baseline="middle" class="small">task · process · foundation · outcome</text>
<path d="M 760 425 L 716 425" class="line"/>
<rect x="410" y="360" width="300" height="130" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="414.0" text-anchor="middle" dominant-baseline="middle" class="label">07 Change &amp; revalidate</text>
<text x="560.0" y="436.0" text-anchor="middle" dominant-baseline="middle" class="small">knowledge · spec · tool · model · policy</text>
<path d="M 410 425 L 366 425" class="line"/>
<rect x="60" y="360" width="300" height="130" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="210.0" y="414.0" text-anchor="middle" dominant-baseline="middle" class="label">08 Authority disposition</text>
<text x="210.0" y="436.0" text-anchor="middle" dominant-baseline="middle" class="small">promote · hold · demote · retire</text>
<path d="M 60 425 C 20 425, 20 285, 190 285 L 1260 285 C 1360 285, 1380 255, 1380 242" class="dash"/>
<rect x="300" y="560" width="900" height="58" rx="7" fill="#eef5f7" stroke="#5b8792" stroke-width="2"/>
<text x="750.0" y="589.0" text-anchor="middle" dominant-baseline="middle" class="label">Retirement: revoke credentials · stop traffic · close queues and callbacks · retain required evidence</text>
<path d="M 210 490 L 300 589" class="dash"/>
</svg>