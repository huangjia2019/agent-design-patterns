name: Documents

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documents:
    name: Publication checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/tooling/requirements.txt
      - run: python docs/tooling/check.py
      - run: python -m unittest discover -s docs/tooling -p 'test_*.py' -v
